kind = "web"
  previewPath = "/"
  title = "Bike Component Tracker"
  version = "1.0.0"
  id = "artifacts/bike-tracker"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  localPort = 21213
  name = "web"
  paths = ["/"]

  [services.development]
  run = "pnpm --filter @workspace/bike-tracker run dev"

  [services.env]
  PORT = "21213"
  BASE_PATH = "/"

  [services.production]
  build = ["pnpm", "--filter", "@workspace/bike-tracker", "run", "build"]
  publicDir = "artifacts/bike-tracker/dist/public"
  serve = "static"

  [[services.production.rewrites]]
  from = "/*"
  to = "/index.html"
  